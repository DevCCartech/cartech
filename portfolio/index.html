<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charl Jun V. | Lead Developer & Systems Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            orange: '#f16e36',
                            orangeHover: '#d95a23',
                            cyan: '#00f2fe',
                            cyanHover: '#00d8e4',
                            emerald: '#10b981',
                            dark: '#070d19',
                            card: '#0d1829',
                            panel: '#111f38'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #070d19;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(241, 110, 54, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(13, 24, 41, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(11, 20, 36, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glow-orange {
            box-shadow: 0 0 25px -5px rgba(241, 110, 54, 0.4);
        }
        .glow-cyan {
            box-shadow: 0 0 25px -5px rgba(0, 242, 254, 0.3);
        }
    </style>
</head>
<body class="antialiased text-slate-200 selection:bg-brand-orange selection:text-white flex flex-col min-h-screen">

    <nav class="sticky top-0 z-40 glass-panel border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-brand-orange to-amber-500 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-brand-orange/20 group-hover:scale-105 transition-transform">
                    CJ
                </div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-lg text-white tracking-wide flex items-center gap-2">
                        Charl Jun V.
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    </h1>
                    <p class="text-[11px] text-slate-400 font-mono">Full-Stack Lead Developer</p>
                </div>
            </a>

            <!-- Navigation Links -->
            <div class="hidden md:flex items-center gap-8 text-xs font-semibold tracking-wider text-slate-300">
                <a href="#about" class="hover:text-brand-orange transition">ABOUT</a>
                <a href="#projects" class="hover:text-brand-orange transition">PROJECTS</a>
                <a href="#skills" class="hover:text-brand-orange transition">SKILLS</a>
                <a href="#server-note" class="hover:text-brand-orange transition text-brand-orange">SYSTEM NOTE</a>
                <a href="#contact" class="hover:text-brand-orange transition">CONTACT</a>
            </div>

            <a href="#contact" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-orange to-amber-500 hover:from-brand-orangeHover hover:to-amber-600 text-white font-bold text-xs shadow-lg shadow-brand-orange/20 transition flex items-center gap-2">
                <i data-lucide="message-square" class="w-4 h-4"></i>
                <span>Hire / Message</span>
            </a>
        </div>
    </nav>

    <section class="relative pt-12 pb-20 lg:pt-20 lg:pb-32 overflow-hidden">
